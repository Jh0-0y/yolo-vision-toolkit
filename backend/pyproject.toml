[project]
name = "yolo-vision-toolkit-backend"
version = "0.0.1-rc1-20260727"
description = "YOLO auto-labeling + training toolkit backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ultralytics>=8.3",
    "lap>=0.5.12",
    "adaptive-crop @ git+https://github.com/Jh0-0y/adaptive-crop@0.0.1-rc1-20260811",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# app/ 밖의 lib/·infra/ 테스트도 잡히도록 루트부터 훑는다
testpaths = ["tests", "app/tests"]

[tool.uv]
package = false
