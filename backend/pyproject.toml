[project]
name = "yolo-vision-toolkit-backend"
version = "0.0.1-rc1-20260727"
description = "YOLO auto-labeling + training toolkit backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ultralytics>=8.3",
    "lap>=0.5.12",
    # 크롭 좌표 계산(공·선수 추적 → 세로 크롭 X). CropWorker와 같은 라이브러리를 쓴다.
    # 비공개 저장소 — 설치하려면 git이 GitHub에 인증할 수 있어야 한다(README 참고).
    "adaptive-crop @ git+https://github.com/Jh0-0y/adaptive-crop@v0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.uv]
package = false
