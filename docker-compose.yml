# 배포 전용 — 소스 빌드 없이 GHCR 이미지를 pull 해서 실행한다.
# 이미지 빌드·푸시는 compose 가 아니라 scripts/build.sh 가 담당한다.
#
# 실행:
#   cp example.env .env    # 최초 1회 — 경로/옵션/TAG 를 환경에 맞게 수정
#   docker compose up -d   # compose 는 같은 폴더의 .env 를 자동으로 읽는다
#
# 이 구성은 윈도우(WSL2) + NVIDIA GPU 전용이다. GPU 를 무조건 붙이므로 GPU 없는
# 호스트에선 컨테이너가 뜨지 않는다(의도된 것 — 맥/CPU 는 dev.sh 로컬 실행).
services:
  backend:
    image: ghcr.io/jh0-0y/yvt-backend:${TAG:-latest}
    pull_policy: always      # up 할 때마다 최신 이미지 확인·갱신
    restart: unless-stopped
    # PyTorch DataLoader 워커는 /dev/shm 으로 텐서를 공유한다. Docker 기본 64MB로는
    # 학습 시 "insufficient shared memory (shm)" 에러가 나므로 키운다. RAM 32GB↑=8gb, 16GB=4gb.
    shm_size: "${SHM_SIZE:-8gb}"
    environment:
      # 컨테이너 내부의 고정 경로(별명). 실제 위치는 아래 volumes 가 결정한다.
      YVT_DATA_DIR: /data            # 벌크 저장소(HDD) — 데이터셋·모델·runs·DB
      YVT_SSD_CACHE_DIR: /ssd-cache  # 학습 스테이징(SSD) — 런 시작 시 복제, 종료 시 삭제
      YVT_DEVICE: ${YVT_DEVICE:-0}   # 0 (cuda 0번) | cpu
    volumes:
      # 왼쪽 = 호스트 실제 경로(.env 에서 지정) / 오른쪽 = 컨테이너 내부 별명
      - ${DATA_DIR:-./data}:/data         # HDD (영구 저장)
      - ${CACHE_DIR:-./cache}:/ssd-cache  # SSD 캐시 (학습 시 복사→종료 시 삭제, :ro 금지)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: ghcr.io/jh0-0y/yvt-frontend:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    # 외부에 열어야 할 포트는 이 하나뿐 — nginx 가 /api 를 backend 로 프록시한다.
    ports:
      - "${FRONTEND_PORT:-3000}:80"
